<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Tube - Smart Video Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --fb-blue: #1877F2;
      --fb-bg: #F0F2F5;
      --fb-card: #FFFFFF;
      --fb-border: #CED0D4;
    }
    body { background-color: var(--fb-bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #bcc0c4; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm px-4 lg:px-8 py-2.5 flex items-center justify-between">
    <!-- Brand -->
    <div class="flex items-center gap-3">
      <div onclick="filterCategory(event, 'ALL')" class="flex items-center gap-2 cursor-pointer group">
        <div class="w-10 h-10 rounded-full bg-[#1877F2] flex items-center justify-center text-white text-xl font-bold shadow-md shadow-blue-500/20 group-hover:scale-105 transition">
          <i class="fa-solid fa-play ml-0.5"></i>
        </div>
        <span class="text-2xl font-black text-[#1877F2] tracking-tight">V-Tube</span>
      </div>
      <span id="admin-badge" class="hidden text-[11px] bg-blue-50 text-[#1877F2] border border-blue-200 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">
        <i class="fa-solid fa-shield-halved mr-1"></i>Admin
      </span>
    </div>

    <!-- Category Pills -->
    <div id="category-pills" class="hidden md:flex items-center gap-1.5 bg-slate-100 p-1 rounded-full border border-slate-200 text-xs font-semibold">
      <button onclick="filterCategory(event, 'ALL')" class="cat-pill bg-white text-[#1877F2] px-4 py-1.5 rounded-full shadow-sm transition" data-i18n="cat_all">All</button>
      <button onclick="filterCategory(event, 'Education')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" data-i18n="cat_edu">Education</button>
      <button onclick="filterCategory(event, 'Technology')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" data-i18n="cat_tech">Technology</button>
      <button onclick="filterCategory(event, 'Entertainment')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" data-i18n="cat_ent">Entertainment</button>
      <button onclick="filterCategory(event, 'Music')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" data-i18n="cat_music">Music</button>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-2.5">
      <button onclick="toggleLanguage()" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-full text-xs font-bold transition shadow-sm">
        <i class="fa-solid fa-globe text-[#1877F2]"></i>
        <span id="lang-label">हिन्दी</span>
      </button>
      <div class="flex items-center gap-2" id="nav-actions"></div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 w-full flex-1">
    
    <!-- VIDEO PLAYER BOX -->
    <div id="player-container" class="hidden mb-6 bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
      <div class="aspect-video w-full max-w-4xl mx-auto rounded-xl overflow-hidden bg-black shadow-lg">
        <iframe id="main-player" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="max-w-4xl mx-auto mt-4 flex justify-between items-start">
        <div>
          <h1 id="player-title" class="text-xl font-bold text-slate-900"></h1>
          <p id="player-desc" class="text-sm text-slate-500 mt-1 whitespace-pre-line"></p>
        </div>
        <button onclick="closePlayer()" class="text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-full transition" title="Close">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>
    </div>

    <!-- Personalized Recommendations -->
    <div id="interest-banner" class="hidden mb-6 p-4 rounded-2xl bg-gradient-to-r from-blue-50 to-white border border-blue-100 shadow-sm flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-[#1877F2] text-white flex items-center justify-center text-sm shadow">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <div class="text-sm">
          <span class="font-bold text-slate-900" data-i18n="personalized_feed">Personalized for you:</span>
          <span id="user-interest-tags" class="text-[#1877F2] font-semibold ml-1"></span>
        </div>
      </div>
      <button onclick="switchView('mine')" class="text-xs font-bold text-[#1877F2] hover:underline" data-i18n="view_my_uploads">View my uploads →</button>
    </div>

    <!-- Feed Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5">
      <h2 id="feed-title" class="text-xl font-black text-slate-800" data-i18n="feed_heading">Recommended Videos</h2>
      
      <div id="view-tabs" class="flex items-center gap-1.5 bg-slate-200/70 p-1 rounded-xl text-xs font-bold">
        <button onclick="switchView('public')" id="tab-public" class="bg-white text-[#1877F2] px-4 py-1.5 rounded-lg shadow-sm transition" data-i18n="tab_explore">Explore (Public)</button>
        <button onclick="switchView('mine')" id="tab-mine" class="hidden text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-lg transition" data-i18n="tab_my_videos">My Videos</button>
        <button onclick="switchView('users_mgr')" id="tab-admin" class="hidden text-indigo-700 hover:bg-indigo-100 px-3.5 py-1.5 rounded-lg transition" data-i18n="tab_users_mgr">User Management</button>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

    <!-- Admin Users Panel -->
    <div id="admin-users-panel" class="hidden bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm mt-4">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-sm text-slate-800" data-i18n="registered_users">Registered Users Directory</h3>
        <span id="total-users" class="text-xs font-semibold text-slate-500"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="text-xs bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-200">
            <tr>
              <th class="p-3.5">Name</th>
              <th class="p-3.5">Email</th>
              <th class="p-3.5">Role</th>
              <th class="p-3.5">Interests</th>
              <th class="p-3.5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL: REGISTER -->
  <div id="register-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-lg font-black text-slate-900" data-i18n="create_account_title">Create Account</h3>
          <p class="text-xs text-slate-500" data-i18n="create_account_sub">It's quick and free to join V-Tube.</p>
        </div>
        <button onclick="closeModal('register-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleRegister(event)" class="space-y-3.5">
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_name">Full Name / Channel Name</label>
          <input id="reg-name" required type="text" placeholder="e.g. Ritesh Srivastava" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_email">Email Address</label>
          <input id="reg-email" required type="email" placeholder="name@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_password">Password</label>
          <input id="reg-pass" required type="password" placeholder="At least 6 characters" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1.5" data-i18n="label_interests">Select Your Favorite Topics (at least one):</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="interest" value="Education" class="accent-[#1877F2]" checked> Education</label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="interest" value="Technology" class="accent-[#1877F2]"> Technology</label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="interest" value="Entertainment" class="accent-[#1877F2]"> Entertainment</label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="interest" value="Music" class="accent-[#1877F2]"> Music</label>
          </div>
        </div>
        <button type="submit" id="reg-btn" class="w-full bg-[#1877F2] hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md shadow-blue-500/20" data-i18n="btn_register">Sign Up</button>
      </form>
      <p class="text-xs text-slate-500 text-center mt-4">
        <span data-i18n="already_have_acc">Already have an account?</span> <button onclick="switchToLogin()" class="text-[#1877F2] font-bold hover:underline" data-i18n="btn_login_link">Log In</button>
      </p>
    </div>
  </div>

  <!-- MODAL: LOGIN -->
  <div id="login-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-lg font-black text-slate-900" data-i18n="login_title">Log In to V-Tube</h3>
          <p class="text-xs text-slate-500" data-i18n="login_sub">Welcome back! Please enter your details.</p>
        </div>
        <button onclick="closeModal('login-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-3.5">
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_email">Email</label>
          <input id="login-email" required type="email" placeholder="name@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_password">Password</label>
          <input id="login-pass" required type="password" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-[#1877F2] hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md shadow-blue-500/20" data-i18n="btn_signin">Sign In</button>
      </form>
      <p class="text-xs text-slate-500 text-center mt-4">
        <span data-i18n="need_new_acc">Need an account?</span> <button onclick="switchToRegister()" class="text-[#1877F2] font-bold hover:underline" data-i18n="btn_register_link">Create one</button>
      </p>
    </div>
  </div>

  <!-- MODAL: UPLOAD (Protected) -->
  <div id="upload-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-black text-slate-900" data-i18n="upload_title">Upload New Video</h3>
        <button onclick="closeModal('upload-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleUpload(event)" class="space-y-3.5">
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_vid_title">Video Title</label>
          <input id="vid-title" required type="text" placeholder="e.g. Science Class Lecture 1" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_vid_url">YouTube Video URL or ID</label>
          <input id="vid-url" required type="text" placeholder="https://youtu.be/... or video ID" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-700" data-i18n="label_category">Category</label>
            <select id="vid-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none font-medium">
              <option value="Education">Education</option>
              <option value="Technology">Technology</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Music">Music</option>
              <option value="General">General</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-700" data-i18n="label_visibility">Visibility</label>
            <select id="vid-visibility" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none font-medium">
              <option value="public" data-i18n="opt_public">🌐 Public (All)</option>
              <option value="private" data-i18n="opt_private">🔒 Private (Only Me)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" data-i18n="label_desc">Description</label>
          <textarea id="vid-desc" rows="2" placeholder="Brief overview of the video content..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('upload-modal')" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800" data-i18n="btn_cancel">Cancel</button>
          <button type="submit" id="save-vid-btn" class="bg-[#1877F2] hover:bg-blue-600 text-white font-bold px-5 py-2 rounded-xl text-sm transition shadow-md shadow-blue-500/20" data-i18n="btn_upload">Publish Video</button>
        </div>
      </form>
    </div>
  </div>

        confirm_logout: "क्या आप लॉगआउट करना चाहते हैं?",
        confirm_del_vid: "क्या आप वाकई इस वीडियो को हमेशा के लिए हटाना चाहते हैं?",
        confirm_del_user: "चेतावनी: यूज़र अकाउंट डिलीट करने से उनके सभी वीडियो भी हमेशा के लिए हट जाएँगे। क्या आप जारी रखना चाहते हैं?"
      }
    };

    // State
    let currentLang = localStorage.getItem('vt_lang') || 'en';
    let currentUser = JSON.parse(localStorage.getItem('vt_session') || 'null');
    let allVideos = [];
    let currentFilter = 'ALL';
    let currentTab = 'public';

    // Apply Language
    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('vt_lang', lang);
      document.getElementById('lang-label').innerText = (lang === 'en') ? 'हिन्दी' : 'English';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
      renderNav();
      renderFeed();
    }

    function toggleLanguage() {
      const next = (currentLang === 'en') ? 'hi' : 'en';
      applyLanguage(next);
    }

    // Modal Helpers
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function switchToLogin() { closeModal('register-modal'); openModal('login-modal'); }
    function switchToRegister() { closeModal('login-modal'); openModal('register-modal'); }

    // YouTube ID Extractor
    function extractYouTubeID(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url.trim();
    }

    // Navigation UI
    function renderNav() {
      const nav = document.getElementById('nav-actions');
      const adminBadge = document.getElementById('admin-badge');
      const tabMine = document.getElementById('tab-mine');
      const tabAdmin = document.getElementById('tab-admin');
      const interestBanner = document.getElementById('interest-banner');
      const t = translations[currentLang];

      if (currentUser) {
        const isAdmin = currentUser.role === 'admin';
        if (isAdmin) adminBadge.classList.remove('hidden');
        tabMine.classList.remove('hidden');
        if (isAdmin) tabAdmin.classList.remove('hidden');

        if (currentUser.interests && currentUser.interests.length > 0) {
          interestBanner.classList.remove('hidden');
          document.getElementById('user-interest-tags').innerText = currentUser.interests.join(', ');
        }

        nav.innerHTML = `
          <button onclick="openModal('upload-modal')" class="bg-[#1877F2] hover:bg-blue-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
            <i class="fa-solid fa-cloud-arrow-up"></i> <span>${t.btn_upload_nav}</span>
          </button>
          <div class="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-xs">
            <span class="w-2 h-2 rounded-full ${isAdmin ? 'bg-indigo-600' : 'bg-emerald-500'}"></span>
            <span class="font-bold text-slate-800 max-w-[90px] truncate">${currentUser.name}</span>
            <button onclick="handleLogout()" title="Logout" class="text-slate-400 hover:text-red-500 ml-1 transition">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
          </div>
        `;
      } else {
        adminBadge.classList.add('hidden');
        tabMine.classList.add('hidden');
        tabAdmin.classList.add('hidden');
        interestBanner.classList.add('hidden');

        nav.innerHTML = `
          <button onclick="openModal('login-modal')" class="text-xs font-bold text-slate-700 hover:text-[#1877F2] px-3 py-1.5 transition">
            ${t.btn_login}
          </button>
          <button onclick="openModal('register-modal')" class="bg-[#1877F2] hover:bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-sm transition">
            ${t.btn_create_acc}
          </button>
        `;
      }
    }

    // AUTH: REGISTER
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-pass').value.trim();
      const checkboxes = document.querySelectorAll('input[name="interest"]:checked');
      const interests = Array.from(checkboxes).map(c => c.value);

      if (interests.length === 0) {
        alert("Please pick at least one topic of interest!");
        return;
      }

      const btn = document.getElementById('reg-btn');
      btn.innerText = "...";
      btn.disabled = true;

      const newUser = { id: 'usr_' + Date.now(), name, email, password, interests, role: 'user' };

      if (supabase) {
        try {
          const { data, error } = await supabase.from('app_users').insert([
            { name, email, password, interests, role: 'user' }
          ]).select().single();
          if (!error && data) newUser.id = data.id;
        } catch (err) { console.warn("Supabase register error:", err); }
      }

      // Local Session Storage
      currentUser = newUser;
      localStorage.setItem('vt_session', JSON.stringify(newUser));
      btn.innerText = translations[currentLang].btn_register;
      btn.disabled = false;

      closeModal('register-modal');
      renderNav();
      fetchVideos();
    }

    // AUTH: LOGIN
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-pass').value.trim();
      const btn = document.getElementById('login-btn');

      btn.innerText = "...";
      btn.disabled = true;

      let loggedIn = null;

      // Hardcoded Admin Quick Access
      if (email === 'admin@mytube.com' && password === 'admin123') {
        loggedIn = { id: 'admin_root', name: 'Super Admin', email: 'admin@mytube.com', role: 'admin', interests: ['Education', 'Technology'] };
      }

      if (!loggedIn && supabase) {
        try {
          const { data } = await supabase.from('app_users').select('*').eq('email', email).eq('password', password).single();
          if (data) loggedIn = data;
        } catch (err) { console.warn("Supabase login err:", err); }
      }

      btn.innerText = translations[currentLang].btn_signin;
      btn.disabled = false;

      if (!loggedIn) {
        alert("Invalid email or password!");
        return;
      }

      currentUser = loggedIn;
      localStorage.setItem('vt_session', JSON.stringify(loggedIn));
      closeModal('login-modal');
      renderNav();
      fetchVideos();
    }

    function handleLogout() {
      if (confirm(translations[currentLang].confirm_logout)) {
        localStorage.removeItem('vt_session');
        currentUser = null;
        switchView('public');
        renderNav();
        fetchVideos();
      }
    }

    // UPLOAD VIDEO
    async function handleUpload(e) {
      e.preventDefault();
      if (!currentUser) return;

      const title = document.getElementById('vid-title').value.trim();
      const rawUrl = document.getElementById('vid-url').value.trim();
      const category = document.getElementById('vid-category').value;
      const visibility = document.getElementById('vid-visibility').value;
      const description = document.getElementById('vid-desc').value.trim();
      const ytId = extractYouTubeID(rawUrl);

      if (!ytId) {
        alert("Invalid YouTube URL!");
        return;
      }

      const newVid = {
        id: 'vid_' + Date.now(),
        user_id: currentUser.id,
        creator_name: currentUser.name,
        title,
        description,
        youtube_id: ytId,
        category,
        visibility,
        thumbnail_url: `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`,
        views: 1,
        created_at: new Date().toISOString()
      };

      if (supabase) {
        try {
          await supabase.from('videos').insert([{
            user_id: currentUser.id,
            title,
            description,
            youtube_id: ytId,
            category,
            visibility,
            thumbnail_url: newVid.thumbnail_url,
            views: 1
          }]);
        } catch (err) { console.warn("Supabase insert error:", err); }
      }

      // Local backup sync
      const cache = JSON.parse(localStorage.getItem('vt_videos_cache') || '[]');
      cache.unshift(newVid);
      localStorage.setItem('vt_videos_cache', JSON.stringify(cache));

      closeModal('upload-modal');
      document.getElementById('vid-title').value = '';
      document.getElementById('vid-url').value = '';
      document.getElementById('vid-desc').value = '';
      fetchVideos();
    }

    // FETCH VIDEOS
    async function fetchVideos() {
      let videos = [];
      if (supabase) {
        try {
          const { data, error } = await supabase.from('videos').select('*, app_users(name, role)').order('created_at', { ascending: false });
          if (!error && data && data.length > 0) videos = data;
        } catch (err) { console.warn("Fetch error:", err); }
      }

      if (videos.length === 0) {
        const cached = JSON.parse(localStorage.getItem('vt_videos_cache') || '[]');
        if (cached.length > 0) {
          videos = cached;
        } else {
          // Default Demo Content
          videos = [
            {
              id: 'demo_1',
              title: 'Learn Modern Web Architecture with Practical Examples',
              description: 'Comprehensive overview of building smart, cost-effective web platforms.',
              youtube_id: 'dQw4w9WgXcQ',
              category: 'Education',
              visibility: 'public',
              creator_name: 'Platform Instructor',
              views: 142
            },
            {
              id: 'demo_2',
              title: 'Introduction to Cloud Databases & Serverless Technology',
              description: 'How serverless cloud backends scale automatically with zero maintenance.',
              youtube_id: 'aircAruvnKk',
              category: 'Technology',
              visibility: 'public',
              creator_name: 'Tech Lab',
              views: 98
            }
          ];
        }
      }

      allVideos = videos;
      renderFeed();
    }

    // RENDER FEED WITH SMART INTEREST RANKING
    function renderFeed() {
      const grid = document.getElementById('video-grid');
      const usersPanel = document.getElementById('admin-users-panel');
      const t = translations[currentLang];

      if (currentTab === 'users_mgr') {
        grid.classList.add('hidden');
        usersPanel.classList.remove('hidden');
        loadAdminUsers();
        return;
      } else {
        grid.classList.remove('hidden');
        usersPanel.classList.add('hidden');
      }

      let list = [];
      const isAdmin = currentUser && currentUser.role === 'admin';

      if (currentTab === 'mine') {
        list = allVideos.filter(v => v.user_id === currentUser.id);
      } else {
        list = allVideos.filter(v => v.visibility === 'public');

        // SMART INTEREST RANKING
        if (currentUser && currentUser.interests && currentUser.interests.length > 0) {
          const uTags = currentUser.interests;
          list.sort((a, b) => {
            const aMatch = uTags.includes(a.category) ? 1 : 0;
            const bMatch = uTags.includes(b.category) ? 1 : 0;
            return bMatch - aMatch;
          });
        }
      }

      // Filter category pills
      if (currentFilter !== 'ALL') {
        list = list.filter(v => v.category === currentFilter);
      }

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 font-medium">${t.no_videos_msg}</div>`;
        return;
      }

      grid.innerHTML = list.map(v => {
        const canDelete = isAdmin || (currentUser && currentUser.id === v.user_id);
        const isPrivate = v.visibility === 'private';
        const author = v.app_users?.name || v.creator_name || 'V-Tube Creator';

        return `
          <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden hover:shadow-md transition-shadow duration-200 flex flex-col justify-between group">
            <div onclick="playVideo('${v.youtube_id}', '${encodeURIComponent(v.title)}', '${encodeURIComponent(v.description || '')}')" class="cursor-pointer">
              <div class="aspect-video bg-slate-900 relative overflow-hidden">
                <img src="${v.thumbnail_url || 'https://img.youtube.com/vi/' + v.youtube_id + '/hqdefault.jpg'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                <span class="absolute bottom-2.5 right-2.5 bg-black/75 text-white text-[10px] font-bold px-2 py-0.5 rounded-full backdrop-blur-sm">${v.category}</span>
                ${isPrivate ? '<span class="absolute top-2.5 left-2.5 bg-amber-500 text-white font-bold text-[10px] px-2 py-0.5 rounded-full shadow"><i class="fa-solid fa-lock mr-1"></i>Private</span>' : ''}
              </div>
              <div class="p-4">
                <h3 class="font-bold text-sm text-slate-900 line-clamp-2 group-hover:text-[#1877F2] transition">${v.title}</h3>
                <div class="flex items-center justify-between text-xs text-slate-500 mt-2.5 font-medium">
                  <span class="flex items-center gap-1.5"><i class="fa-regular fa-circle-user text-slate-400"></i> ${author}</span>
                  <span>${v.views || 1} views</span>
                </div>
              </div>
            </div>

            ${canDelete ? `
              <div class="px-4 pb-3 pt-0 flex justify-end">
                <button onclick="deleteVideo('${v.id}')" class="text-xs font-bold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1 rounded-lg transition border border-red-100">
                  <i class="fa-solid fa-trash-can mr-1"></i> ${isAdmin && v.user_id !== currentUser?.id ? 'Delete (Admin)' : 'Delete'}
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // PLAY VIDEO
    function playVideo(ytId, encTitle, encDesc) {
      const container = document.getElementById('player-container');
      const player = document.getElementById('main-player');
      container.classList.remove('hidden');
      player.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
      document.getElementById('player-title').innerText = decodeURIComponent(encTitle);
      document.getElementById('player-desc').innerText = decodeURIComponent(encDesc);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
      const container = document.getElementById('player-container');
      const player = document.getElementById('main-player');
      player.src = '';
      container.classList.add('hidden');
    }

    // DELETE VIDEO
    async function deleteVideo(vidId) {
      if (!confirm(translations[currentLang].confirm_del_vid)) return;

      if (supabase) {
        try { await supabase.from('videos').delete().eq('id', vidId); } catch(e){}
      }

      allVideos = allVideos.filter(v => v.id !== vidId);
      const cache = JSON.parse(localStorage.getItem('vt_videos_cache') || '[]').filter(v => v.id !== vidId);
      localStorage.setItem('vt_videos_cache', JSON.stringify(cache));

      renderFeed();
    }

    // ADMIN: USER MANAGEMENT
    async function loadAdminUsers() {
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">Loading directory...</td></tr>';

      let users = [];
      if (supabase) {
        try {
          const { data } = await supabase.from('app_users').select('*').order('created_at', { ascending: false });
          if (data) users = data;
        } catch(e){}
      }

      if (users.length === 0) {
        users = [
          { id: 'u1', name: 'Super Admin', email: 'admin@mytube.com', role: 'admin', interests: ['Education', 'Technology'] }
        ];
      }

      document.getElementById('total-users').innerText = `Total: ${users.length} Users`;

      tbody.innerHTML = users.map(u => `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="p-3.5 font-bold text-slate-800">${u.name}</td>
          <td class="p-3.5 text-slate-500 font-mono text-xs">${u.email}</td>
          <td class="p-3.5">
            <span class="px-2.5 py-0.5 text-xs font-bold rounded-full ${u.role === 'admin' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-slate-100 text-slate-600'}">
              ${u.role}
            </span>
          </td>
          <td class="p-3.5 text-xs text-slate-500">${(u.interests || []).join(', ') || '-'}</td>
          <td class="p-3.5 text-right">
            ${u.role !== 'admin' ? `
              <button onclick="deleteUserAccount('${u.id}')" class="text-xs font-bold bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg border border-red-200 transition">
                Remove User
              </button>
            ` : '<span class="text-xs text-slate-400 font-bold">Protected</span>'}
          </td>
        </tr>
      `).join('');
    }

    async function deleteUserAccount(userId) {
      if (!confirm(translations[currentLang].confirm_del_user)) return;
      if (supabase) {
        try { await supabase.from('app_users').delete().eq('id', userId); } catch(e){}
      }
      loadAdminUsers();
      fetchVideos();
    }

    // VIEW SWITCH
    function switchView(view) {
      currentTab = view;
      const tPublic = document.getElementById('tab-public');
      const tMine = document.getElementById('tab-mine');
      const tAdmin = document.getElementById('tab-admin');

      [tPublic, tMine, tAdmin].forEach(el => {
        el.className = 'text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-lg transition';
      });

      if (view === 'public') tPublic.className = 'bg-white text-[#1877F2] px-4 py-1.5 rounded-lg shadow-sm transition font-bold';
      if (view === 'mine') tMine.className = 'bg-white text-[#1877F2] px-4 py-1.5 rounded-lg shadow-sm transition font-bold';
      if (view === 'users_mgr') tAdmin.className = 'bg-indigo-600 text-white px-4 py-1.5 rounded-lg shadow-sm transition font-bold';

      renderFeed();
    }

    function filterCategory(evt, cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.className = 'cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition';
      });
      if (evt && evt.target) {
        evt.target.className = 'cat-pill bg-white text-[#1877F2] px-4 py-1.5 rounded-full shadow-sm transition font-bold';
      }
      renderFeed();
    }

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      applyLanguage(currentLang);
    });
  </script>
</body>
</html>
