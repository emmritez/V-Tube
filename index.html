<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Tube - Smart Video Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #F0F2F5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #bcc0c4; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm px-4 lg:px-8 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div onclick="selectCategory('ALL')" class="flex items-center gap-2 cursor-pointer group">
        <div class="w-10 h-10 rounded-full bg-[#1877F2] flex items-center justify-center text-white text-xl font-bold shadow-md shadow-blue-500/20 group-hover:scale-105 transition">
          <i class="fa-solid fa-play ml-0.5"></i>
        </div>
        <span class="text-2xl font-black text-[#1877F2] tracking-tight">V-Tube</span>
      </div>
      <span id="admin-badge" class="hidden text-[11px] bg-blue-50 text-[#1877F2] border border-blue-200 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">
        <i class="fa-solid fa-shield-halved mr-1"></i>Admin
      </span>
    </div>

    <!-- Category Pills -->
    <div id="category-pills" class="hidden md:flex items-center gap-1.5 bg-slate-100 p-1 rounded-full border border-slate-200 text-xs font-semibold">
      <button onclick="selectCategory('ALL')" class="cat-pill bg-white text-[#1877F2] px-4 py-1.5 rounded-full shadow-sm transition" id="cat-all">All</button>
      <button onclick="selectCategory('Education')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" id="cat-edu">Education</button>
      <button onclick="selectCategory('Technology')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" id="cat-tech">Technology</button>
      <button onclick="selectCategory('Entertainment')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" id="cat-ent">Entertainment</button>
      <button onclick="selectCategory('Music')" class="cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition" id="cat-music">Music</button>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2.5">
      <button onclick="toggleLang()" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-full text-xs font-bold transition shadow-sm">
        <i class="fa-solid fa-globe text-[#1877F2]"></i>
        <span id="lang-btn-text">हिन्दी</span>
      </button>

      <div class="flex items-center gap-2" id="nav-user-actions">
        <!-- Rendered by JS -->
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6 w-full flex-1">
    
    <!-- VIDEO PLAYER -->
    <div id="player-box" class="hidden mb-6 bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
      <div class="aspect-video w-full max-w-4xl mx-auto rounded-xl overflow-hidden bg-black shadow-lg">
        <iframe id="main-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="max-w-4xl mx-auto mt-4 flex justify-between items-start">
        <div>
          <h1 id="playing-title" class="text-xl font-bold text-slate-900"></h1>
          <p id="playing-desc" class="text-sm text-slate-500 mt-1 whitespace-pre-line"></p>
        </div>
        <button onclick="hidePlayer()" class="text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-full transition">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>
    </div>

    <!-- Interest Alert -->
    <div id="interest-banner" class="hidden mb-6 p-4 rounded-2xl bg-gradient-to-r from-blue-50 to-white border border-blue-100 shadow-sm flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-[#1877F2] text-white flex items-center justify-center text-sm shadow">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <div class="text-sm">
          <span class="font-bold text-slate-900" id="lbl-rec-for-you">Recommended for you:</span>
          <span id="interest-pills" class="text-[#1877F2] font-semibold ml-1"></span>
        </div>
      </div>
      <button onclick="changeView('mine')" class="text-xs font-bold text-[#1877F2] hover:underline" id="lbl-view-mine">View my uploads →</button>
    </div>

    <!-- Feed Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5">
      <h2 id="feed-heading-text" class="text-xl font-black text-slate-800">Recommended Videos</h2>
      
      <div class="flex items-center gap-1.5 bg-slate-200/70 p-1 rounded-xl text-xs font-bold">
        <button onclick="changeView('public')" id="tab-public" class="bg-white text-[#1877F2] px-4 py-1.5 rounded-lg shadow-sm transition">Explore</button>
        <button onclick="changeView('mine')" id="tab-mine" class="hidden text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-lg transition">My Videos</button>
        <button onclick="changeView('admin')" id="tab-admin" class="hidden text-indigo-700 hover:bg-indigo-100 px-3.5 py-1.5 rounded-lg transition">User Management</button>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm mt-4">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h3 class="font-bold text-sm text-slate-800" id="lbl-admin-dir">Registered Users Directory</h3>
        <span id="admin-count" class="text-xs font-semibold text-slate-500"></span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="text-xs bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-200">
            <tr>
              <th class="p-3.5">Name</th>
              <th class="p-3.5">Email</th>
              <th class="p-3.5">Role</th>
              <th class="p-3.5">Interests</th>
              <th class="p-3.5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-tbody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL: REGISTER -->
  <div id="modal-register" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-lg font-black text-slate-900" id="m-reg-title">Create Account</h3>
          <p class="text-xs text-slate-500" id="m-reg-sub">It's quick and free to join V-Tube.</p>
        </div>
        <button onclick="hideModal('modal-register')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="doRegister(event)" class="space-y-3.5">
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-reg-name">Full Name / Channel Name</label>
          <input id="form-name" required type="text" placeholder="e.g. Ritesh Srivastava" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-reg-email">Email Address</label>
          <input id="form-email" required type="email" placeholder="name@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-reg-pass">Password</label>
          <input id="form-pass" required type="password" placeholder="At least 6 characters" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700 block mb-1.5" id="lbl-reg-fav">Select Your Favorite Topics:</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="u_interest" value="Education" class="accent-[#1877F2]" checked> Education</label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="u_interest" value="Technology" class="accent-[#1877F2]"> Technology</label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="u_interest" value="Entertainment" class="accent-[#1877F2]"> Entertainment</label>
            <label class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200 cursor-pointer font-medium hover:bg-slate-100"><input type="checkbox" name="u_interest" value="Music" class="accent-[#1877F2]"> Music</label>
          </div>
        </div>
        <button type="submit" id="btn-submit-reg" class="w-full bg-[#1877F2] hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md shadow-blue-500/20">Sign Up</button>
      </form>
      <p class="text-xs text-slate-500 text-center mt-4">
        <span id="lbl-have-acc">Already have an account?</span> <button onclick="toLoginModal()" class="text-[#1877F2] font-bold hover:underline" id="lbl-to-login">Log In</button>
      </p>
    </div>
  </div>

  <!-- MODAL: LOGIN -->
  <div id="modal-login" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-lg font-black text-slate-900" id="m-login-title">Log In to V-Tube</h3>
          <p class="text-xs text-slate-500" id="m-login-sub">Welcome back! Please enter your details.</p>
        </div>
        <button onclick="hideModal('modal-login')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="doLogin(event)" class="space-y-3.5">
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-login-email">Email</label>
          <input id="login-email-input" required type="email" placeholder="name@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-login-pass">Password</label>
          <input id="login-pass-input" required type="password" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <button type="submit" id="btn-submit-login" class="w-full bg-[#1877F2] hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md shadow-blue-500/20">Sign In</button>
      </form>
      <p class="text-xs text-slate-500 text-center mt-4">
        <span id="lbl-need-acc">Need an account?</span> <button onclick="toRegModal()" class="text-[#1877F2] font-bold hover:underline" id="lbl-to-reg">Create one</button>
      </p>
    </div>
  </div>

  <!-- MODAL: UPLOAD -->
  <div id="modal-upload" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-black text-slate-900" id="m-upload-title">Upload New Video</h3>
        <button onclick="hideModal('modal-upload')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="doUpload(event)" class="space-y-3.5">
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-up-title">Video Title</label>
          <input id="up-title" required type="text" placeholder="e.g. Science Class Lecture 1" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-up-url">YouTube Video URL or ID</label>
          <input id="up-url" required type="text" placeholder="https://youtu.be/... or ID" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-700" id="lbl-up-cat">Category</label>
            <select id="up-cat" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none font-medium">
              <option value="Education">Education</option>
              <option value="Technology">Technology</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Music">Music</option>
              <option value="General">General</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-700" id="lbl-up-vis">Visibility</label>
            <select id="up-vis" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none font-medium">
              <option value="public" id="opt-pub">🌐 Public (All)</option>
              <option value="private" id="opt-pri">🔒 Private (Only Me)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-700" id="lbl-up-desc">Description</label>
          <textarea id="up-desc" rows="2" placeholder="Brief overview..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm mt-1 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1877F2]/20 focus:border-[#1877F2]"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="hideModal('modal-upload')" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800" id="btn-up-cancel">Cancel</button>
          <button type="submit" id="btn-submit-upload" class="bg-[#1877F2] hover:bg-blue-600 text-white font-bold px-5 py-2 rounded-xl text-sm transition shadow-md shadow-blue-500/20">Publish Video</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Configuration
    const API_BASE = "https://gccvgzuimkxpfwpjpipd.supabase.co/rest/v1";
    const API_KEY = "sb_publishable_vrmkCl4lnY7S6IchLKJn2g_7O84yGwz";

    // Multi-Language Strings
    const i18n = {
      en: {
        all: "All", edu: "Education", tech: "Technology", ent: "Entertainment", music: "Music",
        rec_feed: "Recommended Videos", rec_for_you: "Recommended for you:", view_mine: "View my uploads →",
        tab_explore: "Explore", tab_my_videos: "My Videos", tab_admin: "User Management",
        admin_dir: "Registered Users Directory",
        reg_title: "Create Account", reg_sub: "It's quick and free to join V-Tube.",
        name: "Full Name / Channel Name", email: "Email Address", pass: "Password",
        fav_topics: "Select Your Favorite Topics:", signup: "Sign Up", have_acc: "Already have an account?",
        login: "Log In", login_title: "Log In to V-Tube", login_sub: "Welcome back! Please enter your details.",
        signin: "Sign In", need_acc: "Need an account?", create_one: "Create one",
        up_title: "Upload New Video", vid_title: "Video Title", vid_url: "YouTube Video URL or ID",
        cat: "Category", vis: "Visibility", pub: "🌐 Public (All)", pri: "🔒 Private (Only Me)",
        desc: "Description", cancel: "Cancel", publish: "Publish Video", nav_upload: "Upload",
        no_videos: "No videos found in this category.",
        confirm_logout: "Do you want to log out?",
        confirm_del_vid: "Are you sure you want to delete this video?",
        confirm_del_user: "Warning: Deleting this user will remove all their data. Continue?"
      },
      hi: {
        all: "सभी", edu: "शिक्षा", tech: "तकनीक", ent: "मनोरंजन", music: "म्यूजिक",
        rec_feed: "सिफारिशें (Recommended)", rec_for_you: "आपके इंटरेस्ट के अनुसार फ़ीड:", view_mine: "मेरी अपलोड्स देखें →",
        tab_explore: "होम (पब्लिक)", tab_my_videos: "मेरी अपलोड्स", tab_admin: "यूज़र मैनेजमेंट",
        admin_dir: "रजिस्टर्ड यूज़र्स लिस्ट",
        reg_title: "नया अकाउंट बनाएँ", reg_sub: "V-Tube से जुड़ना आसान और बिल्कुल फ्री है।",
        name: "पूरा नाम / चैनल नाम", email: "ईमेल पता", pass: "पासवर्ड",
        fav_topics: "पसंदीदा विषय चुनें (कम से कम एक):", signup: "अकाउंट तैयार करें", have_acc: "पहले से अकाउंट है?",
        login: "लॉगिन करें", login_title: "V-Tube में लॉगिन करें", login_sub: "वापसी पर स्वागत है! अपनी जानकारी भरें।",
        signin: "साइन इन", need_acc: "नया अकाउंट चाहिए?", create_one: "रजिस्टर करें",
        up_title: "नया वीडियो जोड़ें", vid_title: "वीडियो का शीर्षक", vid_url: "YouTube लिंक या ID",
        cat: "श्रेणी", vis: "प्राइवेसी", pub: "🌐 पब्लिक (सभी देखें)", pri: "🔒 प्राइवेट (सिर्फ मैं)",
        desc: "विवरण", cancel: "रद्द करें", publish: "अपलोड करें", nav_upload: "अपलोड",
        no_videos: "यहाँ कोई वीडियो उपलब्ध नहीं है।",
        confirm_logout: "क्या आप लॉगआउट करना चाहते हैं?",
        confirm_del_vid: "क्या आप वाकई इस वीडियो को हटाना चाहते हैं?",
        confirm_del_user: "चेतावनी: यूज़र अकाउंट डिलीट करने से उनके सभी वीडियो भी हमेशा के लिए हट जाएँगे। जारी रखें?"
      }
    };

    // State Variables
    let currentLang = localStorage.getItem('vt_lang') || 'en';
    let currentUser = JSON.parse(localStorage.getItem('vt_session') || 'null');
    let videoList = [];
    let currentCategory = 'ALL';
    let currentView = 'public';

    // Direct REST API Fetcher Helper
    async function apiFetch(endpoint, options = {}) {
      const headers = {
        'apikey': API_KEY,
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json',
        ...options.headers
      };
      return fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    }

    // Modal Handlers
    function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function hideModal(id) { document.getElementById(id).classList.add('hidden'); }
    function toLoginModal() { hideModal('modal-register'); showModal('modal-login'); }
    function toRegModal() { hideModal('modal-login'); showModal('modal-register'); }

    // YouTube ID Extractor
    function getYouTubeId(url) {
      if (!url) return '';
      const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const m = url.match(reg);
      return (m && m[2].length === 11) ? m[2] : url.trim();
    }

    // Apply Language
    function applyText() {
      const t = i18n[currentLang];
      document.getElementById('lang-btn-text').innerText = (currentLang === 'en') ? 'हिन्दी' : 'English';
      
      document.getElementById('cat-all').innerText = t.all;
      document.getElementById('cat-edu').innerText = t.edu;
      document.getElementById('cat-tech').innerText = t.tech;
      document.getElementById('cat-ent').innerText = t.ent;
      document.getElementById('cat-music').innerText = t.music;

      document.getElementById('feed-heading-text').innerText = t.rec_feed;
      document.getElementById('lbl-rec-for-you').innerText = t.rec_for_you;
      document.getElementById('lbl-view-mine').innerText = t.view_mine;
      document.getElementById('tab-public').innerText = t.tab_explore;
      document.getElementById('tab-mine').innerText = t.tab_my_videos;
      document.getElementById('tab-admin').innerText = t.tab_admin;
      document.getElementById('lbl-admin-dir').innerText = t.admin_dir;

      document.getElementById('m-reg-title').innerText = t.reg_title;
      document.getElementById('m-reg-sub').innerText = t.reg_sub;
      document.getElementById('lbl-reg-name').innerText = t.name;
      document.getElementById('lbl-reg-email').innerText = t.email;
      document.getElementById('lbl-reg-pass').innerText = t.pass;
      document.getElementById('lbl-reg-fav').innerText = t.fav_topics;
      document.getElementById('btn-submit-reg').innerText = t.signup;
      document.getElementById('lbl-have-acc').innerText = t.have_acc;
      document.getElementById('lbl-to-login').innerText = t.login;

      document.getElementById('m-login-title').innerText = t.login_title;
      document.getElementById('m-login-sub').innerText = t.login_sub;
      document.getElementById('lbl-login-email').innerText = t.email;
      document.getElementById('lbl-login-pass').innerText = t.pass;
      document.getElementById('btn-submit-login').innerText = t.signin;
      document.getElementById('lbl-need-acc').innerText = t.need_acc;
      document.getElementById('lbl-to-reg').innerText = t.create_one;

      document.getElementById('m-upload-title').innerText = t.up_title;
      document.getElementById('lbl-up-title').innerText = t.vid_title;
      document.getElementById('lbl-up-url').innerText = t.vid_url;
      document.getElementById('lbl-up-cat').innerText = t.cat;
      document.getElementById('lbl-up-vis').innerText = t.vis;
      document.getElementById('opt-pub').innerText = t.pub;
      document.getElementById('opt-pri').innerText = t.pri;
      document.getElementById('lbl-up-desc').innerText = t.desc;
      document.getElementById('btn-up-cancel').innerText = t.cancel;
      document.getElementById('btn-submit-upload').innerText = t.publish;

      renderNavbar();
      renderFeedCards();
    }

    function toggleLang() {
      currentLang = (currentLang === 'en') ? 'hi' : 'en';
      localStorage.setItem('vt_lang', currentLang);
      applyText();
    }

    // Render Navigation Actions
    function renderNavbar() {
      const container = document.getElementById('nav-user-actions');
      const badge = document.getElementById('admin-badge');
      const tabMine = document.getElementById('tab-mine');
      const tabAdmin = document.getElementById('tab-admin');
      const banner = document.getElementById('interest-banner');
      const t = i18n[currentLang];

      if (currentUser) {
        const isAdmin = currentUser.role === 'admin';
        badge.className = isAdmin ? 'text-[11px] bg-blue-50 text-[#1877F2] border border-blue-200 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider' : 'hidden';
        tabMine.classList.remove('hidden');
        if (isAdmin) tabAdmin.classList.remove('hidden');

        if (currentUser.interests && currentUser.interests.length > 0) {
          banner.classList.remove('hidden');
          document.getElementById('interest-pills').innerText = currentUser.interests.join(', ');
        } else {
          banner.classList.add('hidden');
        }

        container.innerHTML = `
          <button onclick="showModal('modal-upload')" class="bg-[#1877F2] hover:bg-blue-600 text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
            <i class="fa-solid fa-cloud-arrow-up"></i> <span>${t.nav_upload}</span>
          </button>
          <div class="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-xs">
            <span class="w-2 h-2 rounded-full ${isAdmin ? 'bg-indigo-600' : 'bg-emerald-500'}"></span>
            <span class="font-bold text-slate-800 max-w-[90px] truncate">${currentUser.name}</span>
            <button onclick="doLogout()" title="Logout" class="text-slate-400 hover:text-red-500 ml-1 transition">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
          </div>
        `;
      } else {
        badge.className = 'hidden';
        tabMine.classList.add('hidden');
        tabAdmin.classList.add('hidden');
        banner.classList.add('hidden');

        container.innerHTML = `
          <button onclick="showModal('modal-login')" class="text-xs font-bold text-slate-700 hover:text-[#1877F2] px-3 py-1.5 transition">
            ${t.login}
          </button>
          <button onclick="showModal('modal-register')" class="bg-[#1877F2] hover:bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-sm transition">
            ${t.signup}
          </button>
        `;
      }
    }

    // Register Handler
    async function doRegister(e) {
      e.preventDefault();
      const name = document.getElementById('form-name').value.trim();
      const email = document.getElementById('form-email').value.trim().toLowerCase();
      const password = document.getElementById('form-pass').value.trim();
      const checkedBoxes = document.querySelectorAll('input[name="u_interest"]:checked');
      const interests = Array.from(checkedBoxes).map(b => b.value);

      if (interests.length === 0) {
        alert("Please pick at least one topic!");
        return;
      }

      const userObj = {
        name,
        email,
        password,
        interests,
        role: 'user'
      };

      try {
        const res = await apiFetch('/app_users', {
          method: 'POST',
          headers: { 'Prefer': 'return=representation' },
          body: JSON.stringify(userObj)
        });
        if (res.ok) {
          const inserted = await res.json();
          if (inserted && inserted[0]) userObj.id = inserted[0].id;
        }
      } catch (err) {
        console.warn("Server register fallback:", err);
      }

      if (!userObj.id) userObj.id = 'usr_' + Date.now();

      currentUser = userObj;
      localStorage.setItem('vt_session', JSON.stringify(userObj));
      hideModal('modal-register');
      applyText();
      loadVideos();
    }

    // Login Handler
    async function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email-input').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass-input').value.trim();

      // Quick Admin Bypass
      if (email === 'admin@mytube.com' && pass === 'admin123') {
        currentUser = { id: 'admin_root', name: 'Super Admin', email: 'admin@mytube.com', role: 'admin', interests: ['Education', 'Technology'] };
        localStorage.setItem('vt_session', JSON.stringify(currentUser));
        hideModal('modal-login');
        applyText();
        loadVideos();
        return;
      }

      try {
        const res = await apiFetch(`/app_users?email=eq.${encodeURIComponent(email)}&password=eq.${encodeURIComponent(pass)}&select=*`);
        if (res.ok) {
          const users = await res.json();
          if (users && users.length > 0) {
            currentUser = users[0];
            localStorage.setItem('vt_session', JSON.stringify(currentUser));
            hideModal('modal-login');
            applyText();
            loadVideos();
            return;
          }
        }
      } catch (err) {
        console.warn("DB Login Error:", err);
      }

      alert("Invalid email or password!");
    }

    function doLogout() {
      if (confirm(i18n[currentLang].confirm_logout)) {
        localStorage.removeItem('vt_session');
        currentUser = null;
        changeView('public');
        applyText();
        loadVideos();
      }
    }

    // Upload Video Handler
    async function doUpload(e) {
      e.preventDefault();
      if (!currentUser) return;

      const title = document.getElementById('up-title').value.trim();
      const url = document.getElementById('up-url').value.trim();
      const category = document.getElementById('up-cat').value;
      const visibility = document.getElementById('up-vis').value;
      const description = document.getElementById('up-desc').value.trim();
      const ytId = getYouTubeId(url);

      if (!ytId) {
        alert("Invalid YouTube URL or ID!");
        return;
      }

      const newVideo = {
        id: 'vid_' + Date.now(),
        user_id: currentUser.id,
        creator_name: currentUser.name,
        title,
        description,
        youtube_id: ytId,
        category,
        visibility,
        thumbnail_url: `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`,
        views: 1,
        created_at: new Date().toISOString()
      };

      try {
        await apiFetch('/videos', {
          method: 'POST',
          headers: { 'Prefer': 'return=representation' },
          body: JSON.stringify({
            user_id: currentUser.id.startsWith('usr_') ? null : currentUser.id,
            title,
            description,
            youtube_id: ytId,
            category,
            visibility,
            thumbnail_url: newVideo.thumbnail_url,
            views: 1
          })
        });
      } catch (err) {
        console.warn("Video insert note:", err);
      }

      // Local storage backup
      const cache = JSON.parse(localStorage.getItem('vt_videos_cache') || '[]');
      cache.unshift(newVideo);
      localStorage.setItem('vt_videos_cache', JSON.stringify(cache));

      hideModal('modal-upload');
      document.getElementById('up-title').value = '';
      document.getElementById('up-url').value = '';
      document.getElementById('up-desc').value = '';
      loadVideos();
    }

    // Load Videos
    async function loadVideos() {
      let fetched = [];
      try {
        const res = await apiFetch('/videos?select=*,app_users(name,role)&order=created_at.desc');
        if (res.ok) {
          const list = await res.json();
          if (list && list.length > 0) fetched = list;
        }
      } catch (err) {
        console.warn("Video fetch fallback:", err);
      }

      if (fetched.length === 0) {
        const local = JSON.parse(localStorage.getItem('vt_videos_cache') || '[]');
        if (local.length > 0) {
          fetched = local;
        } else {
          // Default High Quality Demo Videos
          fetched = [
            {
              id: 'demo_1',
              title: 'Learn Modern Web Architecture with Zero-Cost Cloud Tools',
              description: 'Step-by-step practical guide to designing robust web platforms.',
              youtube_id: 'dQw4w9WgXcQ',
              category: 'Education',
              visibility: 'public',
              creator_name: 'Lead Instructor',
              views: 240
            },
            {
              id: 'demo_2',
              title: 'Serverless Databases and Progressive Web Applications Overview',
              description: 'Explore the modern cloud architecture ecosystem without server costs.',
              youtube_id: 'aircAruvnKk',
              category: 'Technology',
              visibility: 'public',
              creator_name: 'Tech Specialist',
              views: 185
            }
          ];
        }
      }

      videoList = fetched;
      renderFeedCards();
    }

    // Render Cards
    function renderFeedCards() {
      const grid = document.getElementById('grid-container');
      const adminBox = document.getElementById('admin-panel');
      const t = i18n[currentLang];

      if (currentView === 'admin') {
        grid.classList.add('hidden');
        adminBox.classList.remove('hidden');
        fetchAdminUsers();
        return;
      } else {
        grid.classList.remove('hidden');
        adminBox.classList.add('hidden');
      }

      let list = [];
      const isAdmin = currentUser && currentUser.role === 'admin';

      if (currentView === 'mine') {
        list = videoList.filter(v => v.user_id === currentUser.id);
      } else {
        list = videoList.filter(v => v.visibility === 'public');

        // Interest Sorting
        if (currentUser && currentUser.interests && currentUser.interests.length > 0) {
          const userTopics = currentUser.interests;
          list.sort((a, b) => {
            const aHas = userTopics.includes(a.category) ? 1 : 0;
            const bHas = userTopics.includes(b.category) ? 1 : 0;
            return bHas - aHas;
          });
        }
      }

      if (currentCategory !== 'ALL') {
        list = list.filter(v => v.category === currentCategory);
      }

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 font-medium">${t.no_videos}</div>`;
        return;
      }

      grid.innerHTML = list.map(v => {
        const canDelete = isAdmin || (currentUser && currentUser.id === v.user_id);
        const isPrivate = v.visibility === 'private';
        const author = v.app_users?.name || v.creator_name || 'V-Tube Creator';

        return `
          <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden hover:shadow-md transition-shadow duration-200 flex flex-col justify-between group">
            <div onclick="playVid('${v.youtube_id}', '${encodeURIComponent(v.title)}', '${encodeURIComponent(v.description || '')}')" class="cursor-pointer">
              <div class="aspect-video bg-slate-900 relative overflow-hidden">
                <img src="${v.thumbnail_url || 'https://img.youtube.com/vi/' + v.youtube_id + '/hqdefault.jpg'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                <span class="absolute bottom-2.5 right-2.5 bg-black/75 text-white text-[10px] font-bold px-2 py-0.5 rounded-full backdrop-blur-sm">${v.category}</span>
                ${isPrivate ? '<span class="absolute top-2.5 left-2.5 bg-amber-500 text-white font-bold text-[10px] px-2 py-0.5 rounded-full shadow"><i class="fa-solid fa-lock mr-1"></i>Private</span>' : ''}
              </div>
              <div class="p-4">
                <h3 class="font-bold text-sm text-slate-900 line-clamp-2 group-hover:text-[#1877F2] transition">${v.title}</h3>
                <div class="flex items-center justify-between text-xs text-slate-500 mt-2.5 font-medium">
                  <span class="flex items-center gap-1.5"><i class="fa-regular fa-circle-user text-slate-400"></i> ${author}</span>
                  <span>${v.views || 1} views</span>
                </div>
              </div>
            </div>

            ${canDelete ? `
              <div class="px-4 pb-3 pt-0 flex justify-end">
                <button onclick="removeVid('${v.id}')" class="text-xs font-bold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1 rounded-lg transition border border-red-100">
                  <i class="fa-solid fa-trash-can mr-1"></i> ${isAdmin && v.user_id !== currentUser?.id ? 'Delete (Admin)' : 'Delete'}
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Play & Close Video
    function playVid(ytId, encTitle, encDesc) {
      const box = document.getElementById('player-box');
      const ifr = document.getElementById('main-iframe');
      box.classList.remove('hidden');
      ifr.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
      document.getElementById('playing-title').innerText = decodeURIComponent(encTitle);
      document.getElementById('playing-desc').innerText = decodeURIComponent(encDesc);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hidePlayer() {
      document.getElementById('main-iframe').src = '';
      document.getElementById('player-box').classList.add('hidden');
    }

    // Delete Video
    async function removeVid(vidId) {
      if (!confirm(i18n[currentLang].confirm_del_vid)) return;
      try {
        await apiFetch(`/videos?id=eq.${vidId}`, { method: 'DELETE' });
      } catch (err) {}

      videoList = videoList.filter(v => v.id !== vidId);
      const cache = JSON.parse(localStorage.getItem('vt_videos_cache') || '[]').filter(v => v.id !== vidId);
      localStorage.setItem('vt_videos_cache', JSON.stringify(cache));
      renderFeedCards();
    }

    // Admin Users Directory
    async function fetchAdminUsers() {
      const tbody = document.getElementById('admin-tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">Loading directory...</td></tr>';

      let list = [];
      try {
        const res = await apiFetch('/app_users?select=*&order=created_at.desc');
        if (res.ok) list = await res.json();
      } catch (e) {}

      if (list.length === 0) {
        list = [{ id: 'u_adm', name: 'Super Admin', email: 'admin@mytube.com', role: 'admin', interests: ['Education', 'Technology'] }];
      }

      document.getElementById('admin-count').innerText = `Total: ${list.length} Users`;
      tbody.innerHTML = list.map(u => `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="p-3.5 font-bold text-slate-800">${u.name}</td>
          <td class="p-3.5 text-slate-500 font-mono text-xs">${u.email}</td>
          <td class="p-3.5">
            <span class="px-2.5 py-0.5 text-xs font-bold rounded-full ${u.role === 'admin' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-slate-100 text-slate-600'}">
              ${u.role}
            </span>
          </td>
          <td class="p-3.5 text-xs text-slate-500">${(u.interests || []).join(', ') || '-'}</td>
          <td class="p-3.5 text-right">
            ${u.role !== 'admin' ? `
              <button onclick="removeUser('${u.id}')" class="text-xs font-bold bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg border border-red-200 transition">
                Remove User
              </button>
            ` : '<span class="text-xs text-slate-400 font-bold">Protected</span>'}
          </td>
        </tr>
      `).join('');
    }

    async function removeUser(uid) {
      if (!confirm(i18n[currentLang].confirm_del_user)) return;
      try {
        await apiFetch(`/app_users?id=eq.${uid}`, { method: 'DELETE' });
      } catch(e){}
      fetchAdminUsers();
      loadVideos();
    }

    // View & Category Selectors
    function changeView(view) {
      currentView = view;
      const bPub = document.getElementById('tab-public');
      const bMine = document.getElementById('tab-mine');
      const bAdm = document.getElementById('tab-admin');

      [bPub, bMine, bAdm].forEach(b => b.className = 'text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-lg transition');

      if (view === 'public') bPub.className = 'bg-white text-[#1877F2] px-4 py-1.5 rounded-lg shadow-sm transition font-bold';
      if (view === 'mine') bMine.className = 'bg-white text-[#1877F2] px-4 py-1.5 rounded-lg shadow-sm transition font-bold';
      if (view === 'admin') bAdm.className = 'bg-indigo-600 text-white px-4 py-1.5 rounded-lg shadow-sm transition font-bold';

      renderFeedCards();
    }

    function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.className = 'cat-pill text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-full transition';
      });
      const targetMap = { 'ALL': 'cat-all', 'Education': 'cat-edu', 'Technology': 'cat-tech', 'Entertainment': 'cat-ent', 'Music': 'cat-music' };
      if (targetMap[cat]) {
        document.getElementById(targetMap[cat]).className = 'cat-pill bg-white text-[#1877F2] px-4 py-1.5 rounded-full shadow-sm transition font-bold';
      }
      renderFeedCards();
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      applyText();
      loadVideos();
    });
  </script>
</body>
</html>
